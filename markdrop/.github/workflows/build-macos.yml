name: macOS-App bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    needs: test
    runs-on: macos-latest # aktuelles Apple-Silicon-Image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: App bauen
        run: ./scripts/build_mac_app.sh --dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Markdrop-macOS
          path: dist/Markdrop.dmg
      - name: Release anhängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Markdrop.dmg
