# Hosting der Feuerwehr-Website auf Netlify (Website liegt im Ordner "website")
[build]
  base = "website"
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/bilder/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
